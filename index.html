<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10241c">
  <meta name="description" content="Хроники Искателя — личный D&D-журнал для партий и персонажей.">
  <title>Хроники Искателя</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/d20.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./design.css">
  <link rel="stylesheet" href="./party-polish.css">
  <link rel="stylesheet" href="./party-final.css">
  <link rel="stylesheet" href="./character-polish.css">
  <script type="module" src="./dist/editor-modern.js"></script>
  <script type="module" src="./dist/party-ui.js"></script>
  <script type="module" src="./dist/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="book-spine" aria-label="Навигация журнала">
      <a class="brand" href="#parties">
        <span class="brand-medallion"><img src="./assets/dragon-crest.svg" alt=""></span>
        <strong>Хроники<br>Искателя</strong>
        <small>Ваши истории живут дольше</small>
      </a>
      <nav class="side-nav" aria-label="Основная навигация">
        <a href="#parties" data-nav="parties"><span aria-hidden="true">♜</span>Партии</a>
        <a href="#character" data-nav="character"><span aria-hidden="true">♞</span>Персонаж</a>
      </nav>
      <div class="spine-mark" aria-hidden="true">✧</div>
      <p class="spine-quote">В каждой партии<br>рождается своя легенда</p>
    </aside>
    <section class="main-stage"><div id="app"></div></section>
  </div>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <a href="#parties" data-nav="parties"><span aria-hidden="true">♜</span>Партии</a>
    <a href="#character" data-nav="character"><span aria-hidden="true">♞</span>Персонаж</a>
  </nav>
  <button id="cloud-status" class="cloud-status" data-action="cloud" type="button">○ Только на устройстве</button>
  <div id="overlay" class="overlay"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
